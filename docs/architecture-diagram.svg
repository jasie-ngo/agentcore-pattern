<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 772" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="10" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#7c8cff"/></marker>
    <marker id="arwc" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="10" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#3fd6e0"/></marker>
    <style>
      .name{fill:#eaf0fb;font-size:14px;font-weight:700}
      .sub{fill:#93a1bd;font-size:11px}
      .nm2{fill:#eaf0fb;font-size:12.5px;font-weight:700}
      .sb2{fill:#93a1bd;font-size:10px}
      .zt{fill:#3fd6e0;font-size:12px;font-weight:700;letter-spacing:1.4px}
      .ttl{fill:#ffffff;font-size:25px;font-weight:800}
      .stl{fill:#93a1bd;font-size:13px}
      .edge{stroke:#7c8cff;stroke-width:2;fill:none;marker-end:url(#arw)}
      .edgec{stroke:#3fd6e0;stroke-width:2;fill:none;marker-end:url(#arwc)}
      .lbl{fill:#c3ccff;font-size:10.5px;font-weight:600}
      .chip{fill:#0f1a30;stroke:#01a88d;stroke-opacity:.55}
      .stg{fill:#eaf0fb;font-size:12.5px;font-weight:800;letter-spacing:.6px}
      .agents{fill:#9fb0d6;font-size:10.5px}
      .badge{fill:#0f1a30;stroke:#8c4fff;stroke-opacity:.6}
      .badget{fill:#d7c9ff;font-size:10px;font-weight:700}
      .lg{fill:#aeb9d4;font-size:11px}
      .flow{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:3 97;animation:flow 2.6s linear infinite}
      .flowp{stroke:#cdd4ff}
      .flowc{stroke:#a6f0f6}
      @keyframes flow{to{stroke-dashoffset:-100}}
      @media (prefers-reduced-motion:reduce){.flow{animation:none;opacity:0}}
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="772" fill="#0f1729"/>
  <text class="ttl" x="40" y="40">Event-Driven Claims Agent — AWS Architecture</text>
  <text class="stl" x="40" y="64">Amazon Bedrock AgentCore · ap-southeast-2 · multi-agent pipeline: understand → decide → execute → learn</text>

  <!-- zone labels -->
  <text class="zt" x="44" y="98">1 · INGRESS</text>
  <text class="zt" x="336" y="98">2 · PROCESSING · AMAZON BEDROCK AGENTCORE</text>
  <text class="zt" x="902" y="98">3 · TOOLS &amp; DATA</text>

  <!-- ================= INGRESS ================= -->
  <g><rect x="40" y="116" width="252" height="56" rx="11" fill="#16203a" stroke="#e7157b" stroke-opacity=".7"/><rect x="52" y="133" width="22" height="22" rx="6" fill="#e7157b"/><text class="name" x="84" y="140">Amazon SES</text><text class="sub" x="84" y="157">Inbound member email</text></g>
  <g><rect x="40" y="212" width="252" height="56" rx="11" fill="#16203a" stroke="#7aa116" stroke-opacity=".7"/><rect x="52" y="229" width="22" height="22" rx="6" fill="#7aa116"/><text class="name" x="84" y="236">Amazon S3</text><text class="sub" x="84" y="253">claims-inbox/ (any file = email)</text></g>
  <g><rect x="40" y="308" width="252" height="56" rx="11" fill="#16203a" stroke="#e7157b" stroke-opacity=".7"/><rect x="52" y="325" width="22" height="22" rx="6" fill="#e7157b"/><text class="name" x="84" y="332">Amazon EventBridge</text><text class="sub" x="84" y="349">Rule on S3 ObjectCreated</text></g>
  <g><rect x="40" y="404" width="252" height="56" rx="11" fill="#16203a" stroke="#ed7100" stroke-opacity=".7"/><rect x="52" y="421" width="22" height="22" rx="6" fill="#ed7100"/><text class="name" x="84" y="428">AWS Lambda · Trigger</text><text class="sub" x="84" y="445">Signs SigV4 → Runtime</text></g>
  <path class="edge" d="M166,172 L166,208"/>
  <path class="edge" d="M166,268 L166,304"/>
  <path class="edge" d="M166,364 L166,400"/>

  <!-- ================= PROCESSING ================= -->
  <rect x="318" y="110" width="500" height="528" rx="16" fill="#01a88d" fill-opacity=".055" stroke="#01a88d" stroke-opacity=".45"/>

  <!-- Runtime · multi-agent pipeline -->
  <g><rect x="334" y="146" width="468" height="296" rx="12" fill="#16203a" stroke="#01a88d" stroke-opacity=".7"/>
    <rect x="346" y="159" width="20" height="20" rx="5" fill="#01a88d"/>
    <text class="name" x="374" y="174">AgentCore Runtime · Multi-Agent Pipeline</text>
    <g><rect class="chip" x="346" y="190" width="444" height="50" rx="8"/><text class="stg" x="360" y="212">UNDERSTAND</text><text class="agents" x="360" y="230">AI-001 Intent + attachment detection · AI-002 Context Manager (Memory)</text></g>
    <g><rect class="chip" x="346" y="252" width="444" height="50" rx="8"/><text class="stg" x="360" y="274">DECIDE</text><text class="agents" x="360" y="292">AI-003 Identity (DynamoDB) · AI-004 Attachments · AI-005 Empathy → routing gate</text></g>
    <g><rect class="chip" x="346" y="314" width="444" height="50" rx="8"/><text class="stg" x="360" y="336">EXECUTE</text><text class="agents" x="360" y="354">AI-011 Writer → draft for staff · AI-012 Reviewer/Editor · human-in-the-loop</text></g>
    <g><rect class="chip" x="346" y="376" width="444" height="50" rx="8"/><text class="stg" x="360" y="398">LEARN</text><text class="agents" x="360" y="416">Memory write-back · Observability &amp; Evaluation</text></g>
  </g>

  <!-- Platform services -->
  <g><rect x="334" y="480" width="228" height="60" rx="11" fill="#16203a" stroke="#01a88d" stroke-opacity=".7"/><rect x="346" y="499" width="22" height="22" rx="6" fill="#01a88d"/><text class="name" x="378" y="506">Amazon Bedrock</text><text class="sub" x="378" y="523">Sonnet · Haiku · 🛡 Guardrail</text></g>
  <g><rect x="574" y="480" width="228" height="60" rx="11" fill="#16203a" stroke="#01a88d" stroke-opacity=".7"/><rect x="586" y="499" width="22" height="22" rx="6" fill="#01a88d"/><text class="name" x="618" y="506">AgentCore Identity</text><text class="sub" x="618" y="523">OAuth token vault (M2M)</text></g>
  <g><rect x="334" y="556" width="228" height="60" rx="11" fill="#16203a" stroke="#01a88d" stroke-opacity=".7"/><rect x="346" y="575" width="22" height="22" rx="6" fill="#01a88d"/><text class="name" x="378" y="582">AgentCore Memory</text><text class="sub" x="378" y="599">Semantic + Summarization</text></g>
  <g><rect x="574" y="556" width="228" height="60" rx="11" fill="#16203a" stroke="#01a88d" stroke-opacity=".7"/><rect x="586" y="575" width="22" height="22" rx="6" fill="#01a88d"/><text class="name" x="618" y="582">AgentCore Policy Engine</text><text class="sub" x="618" y="599">Cedar · pre-tool authz</text></g>

  <!-- Bedrock model call (internal) -->
  <path class="edge" d="M448,442 L448,478"/><text class="lbl" x="456" y="466">Converse</text>

  <!-- ================= TOOLS ================= -->
  <g><rect x="884" y="126" width="176" height="52" rx="11" fill="#16203a" stroke="#dd344c" stroke-opacity=".7"/><rect x="896" y="141" width="22" height="22" rx="6" fill="#dd344c"/><text class="name" x="928" y="148">Amazon Cognito</text><text class="sub" x="928" y="165">M2M · JWT auth</text></g>

  <g><rect x="884" y="212" width="372" height="56" rx="11" fill="#16203a" stroke="#01a88d" stroke-opacity=".7"/><rect x="896" y="229" width="22" height="22" rx="6" fill="#01a88d"/><text class="name" x="928" y="236">AgentCore Gateway</text><text class="sub" x="928" y="253">MCP · 6 Lambda targets · semantic search</text>
    <g><rect class="badge" x="1156" y="227" width="92" height="18" rx="6"/><text class="badget" x="1202" y="240" text-anchor="middle">🛡 Cedar authz</text></g></g>

  <g><rect x="884" y="302" width="372" height="62" rx="11" fill="#16203a" stroke="#ed7100" stroke-opacity=".7"/><rect x="896" y="321" width="22" height="22" rx="6" fill="#ed7100"/><text class="name" x="928" y="328">AWS Lambda · 6 Tool Functions</text><text class="sub" x="928" y="345">policy · claim · review · notify · list-pending · resolve</text></g>

  <g><rect x="884" y="398" width="180" height="56" rx="11" fill="#16203a" stroke="#4b61d1" stroke-opacity=".8"/><rect x="892" y="416" width="20" height="20" rx="6" fill="#4b61d1"/><text class="nm2" x="918" y="422">Amazon DynamoDB</text><text class="sb2" x="918" y="438">Members · Cases · Reviews</text></g>
  <g><rect x="1076" y="398" width="180" height="56" rx="11" fill="#16203a" stroke="#e7157b" stroke-opacity=".7"/><rect x="1084" y="416" width="20" height="20" rx="6" fill="#e7157b"/><text class="nm2" x="1110" y="422">Amazon SNS</text><text class="sb2" x="1110" y="438">Human-review escalation</text></g>
  <g><rect x="884" y="478" width="372" height="52" rx="11" fill="#16203a" stroke="#e7157b" stroke-opacity=".7"/><rect x="896" y="493" width="22" height="22" rx="6" fill="#e7157b"/><text class="name" x="928" y="500">Amazon SES</text><text class="sub" x="928" y="517">Staff-approved reply (draft shown; not auto-sent)</text></g>

  <!-- tools internal arrows -->
  <path class="edge" d="M972,178 L972,208"/><text class="lbl" x="978" y="200">JWT</text>
  <path class="edge" d="M1070,268 L1070,298"/><text class="lbl" x="1076" y="290">invoke</text>
  <path class="edge" d="M974,364 L974,394"/>
  <path class="edge" d="M1166,364 L1166,394"/>
  <path class="edge" d="M1070,364 L1070,474"/><text class="lbl" x="1076" y="392">notify</text>

  <!-- ================= CROSS-ZONE FLOWS ================= -->
  <!-- Trigger Lambda -> Runtime : solid, orthogonal with rounded corners -->
  <path class="edge" d="M292,432 H300 Q310,432 310,422 V312 Q310,302 320,302 H333"/>
  <text class="lbl" x="296" y="292">invoke</text>

  <!-- Runtime -> Gateway : MCP call (solid, straight, aligned with gateway) -->
  <path class="edge" d="M802,236 L883,236"/>
  <text class="lbl" x="812" y="229">MCP call</text>

  <!-- Identity -> Gateway : OAuth token (solid, rounded orthogonal, below MCP) -->
  <path class="edgec" d="M802,510 H840 Q850,510 850,500 V266 Q850,256 860,256 H883"/>
  <text class="lbl" x="856" y="392">OAuth</text><text class="lbl" x="856" y="406">token</text>

  <!-- ================= FLOW ANIMATION (traveling comet along each arrow) ================= -->
  <g>
    <path class="flow flowp" pathLength="100" d="M166,172 L166,208"/>
    <path class="flow flowp" pathLength="100" style="animation-delay:.2s" d="M166,268 L166,304"/>
    <path class="flow flowp" pathLength="100" style="animation-delay:.4s" d="M166,364 L166,400"/>
    <path class="flow flowp" pathLength="100" style="animation-delay:.3s" d="M292,432 H300 Q310,432 310,422 V312 Q310,302 320,302 H333"/>
    <path class="flow flowp" pathLength="100" style="animation-delay:.6s" d="M802,236 L883,236"/>
    <path class="flow flowc" pathLength="100" style="animation-delay:.9s" d="M802,510 H840 Q850,510 850,500 V266 Q850,256 860,256 H883"/>
    <path class="flow flowp" pathLength="100" style="animation-delay:.1s" d="M972,178 L972,208"/>
    <path class="flow flowp" pathLength="100" style="animation-delay:.8s" d="M1070,268 L1070,298"/>
    <path class="flow flowp" pathLength="100" style="animation-delay:1.1s" d="M974,364 L974,394"/>
    <path class="flow flowp" pathLength="100" style="animation-delay:1.2s" d="M1166,364 L1166,394"/>
    <path class="flow flowp" pathLength="100" style="animation-delay:1s" d="M1070,364 L1070,474"/>
    <path class="flow flowp" pathLength="100" style="animation-delay:.5s" d="M448,442 L448,478"/>
  </g>

  <!-- ================= OBSERVABILITY ================= -->
  <rect x="318" y="656" width="938" height="52" rx="14" fill="#8c4fff" fill-opacity=".06" stroke="#8c4fff" stroke-opacity=".45"/>
  <rect x="332" y="672" width="20" height="20" rx="5" fill="#8c4fff"/>
  <text class="name" x="360" y="687">Observability &amp; Evaluation</text>
  <g><rect x="600" y="668" width="150" height="30" rx="8" fill="#0f1a30" stroke="#8c4fff" stroke-opacity=".4"/><text class="sub" x="675" y="687" text-anchor="middle" fill="#cdd7ec">CloudWatch Logs</text></g>
  <g><rect x="762" y="668" width="140" height="30" rx="8" fill="#0f1a30" stroke="#8c4fff" stroke-opacity=".4"/><text class="sub" x="832" y="687" text-anchor="middle" fill="#cdd7ec">X-Ray Traces</text></g>
  <g><rect x="914" y="668" width="164" height="30" rx="8" fill="#0f1a30" stroke="#8c4fff" stroke-opacity=".4"/><text class="sub" x="996" y="687" text-anchor="middle" fill="#cdd7ec">Transaction Search</text></g>
  <g><rect x="1090" y="668" width="152" height="30" rx="8" fill="#0f1a30" stroke="#8c4fff" stroke-opacity=".4"/><text class="sub" x="1166" y="687" text-anchor="middle" fill="#cdd7ec">AgentCore Eval</text></g>

  <!-- ================= LEGEND ================= -->
  <g transform="translate(40,742)">
    <rect x="0" y="0" width="13" height="13" rx="3" fill="#ed7100"/><text class="lg" x="19" y="11">Compute</text>
    <rect x="96" y="0" width="13" height="13" rx="3" fill="#7aa116"/><text class="lg" x="115" y="11">Storage</text>
    <rect x="188" y="0" width="13" height="13" rx="3" fill="#4b61d1"/><text class="lg" x="207" y="11">Database</text>
    <rect x="280" y="0" width="13" height="13" rx="3" fill="#e7157b"/><text class="lg" x="299" y="11">App Integration</text>
    <rect x="410" y="0" width="13" height="13" rx="3" fill="#dd344c"/><text class="lg" x="429" y="11">Identity / Security</text>
    <rect x="560" y="0" width="13" height="13" rx="3" fill="#01a88d"/><text class="lg" x="579" y="11">AI / ML · Bedrock &amp; AgentCore</text>
    <rect x="810" y="0" width="13" height="13" rx="3" fill="#8c4fff"/><text class="lg" x="829" y="11">Observability</text>
    <text class="lg" x="960" y="11" fill="#6b7793">— purple: data flow · cyan: auth · 🛡 policy / guardrail</text>
  </g>
</svg>
