# claims_agent — the dual-agent insurance claims pipeline, defined in YAML
#
# Phase 1  claims_processor (Sonnet)  -> lookup_policy -> ACCEPT/REJECT  (ClaimDecision)
# Phase 2  claims_validator (Haiku)   -> CONFIDENCE + ROUTING           (ClaimValidation)
# Phase 3  execute_claim_decision     -> deterministic: create_claim / request_human_review /
#                                        send_notification, no LLM picks the tools
#
# The coordinator drives the phases through a delegate orchestration. Generic
# wiring (agent factory, Gateway client, Memory session manager) is shared with
# every other use case in ../_shared/.
#
# Run (from the event-driven-claims-agent folder):
#   sca dev --config app/claims_agent/config.yaml
# Deployed: selected in app/main.py (see SWITCHING_USE_CASES.md).

version: "1"
log_level: ${LOG_LEVEL:-INFO}

vars:
  primary_model: ${AGENT_MODEL_ID:-global.anthropic.claude-sonnet-4-6}
  fast_model: ${FAST_MODEL_ID:-global.anthropic.claude-haiku-4-5-20251001-v1:0}
  # Same default as claims_agent/settings.py, interpolated into the validator
  # prompt so the model and the deterministic routing agree.
  auto_approve_threshold: ${AUTO_APPROVE_THRESHOLD:-80}

# ─── Models ───────────────────────────────────────────────────────────────────
# Cost-based routing: Sonnet for the reasoning-heavy claim decision, Haiku for
# validation (a classification task) and for the coordinator, which only
# sequences the phases and relays structured results.

models:
  primary:
    provider: bedrock
    model_id: ${primary_model}

  fast:
    provider: bedrock
    model_id: ${fast_model}

# ─── Session manager ─────────────────────────────────────────────────────────
# AgentCore Memory, declared globally (strands-compose only rewrites a root-level
# session_manager.type to an absolute path) and opted out of by every agent
# except claims_processor, which benefits from recalling prior claims.
# Falls back to local file sessions when no memory id is set.

session_manager:
  type: ../_shared/memory.py:session_manager
  params:
    actor_id: claims-processor
    memory_id: ${MEMORY_CLAIMSAGENTMEMORY_ID:-}
    top_k: ${MEMORY_RETRIEVAL_TOP_K:-5}
    relevance_score: ${MEMORY_RETRIEVAL_RELEVANCE:-0.5}
    namespace_prefix: claims

# ─── Agents ───────────────────────────────────────────────────────────────────
# Every agent uses the shared factory (../_shared/factory.py):
#   agent_kwargs.structured_output  -> Agent(structured_output_model=<class>)
#   agent_kwargs.gateway: true      -> the Identity-managed Gateway MCP client
#                                      attached as a live tool provider

agents:
  # Phase 1. The only agent with Gateway access (least privilege) and the only
  # one with AgentCore Memory — hence preserve_context: true on its connection.
  claims_processor:
    type: ../_shared/factory.py:agent
    model: primary
    description: "Evaluate an insurance claim against the policy and decide ACCEPT or REJECT."
    agent_kwargs:
      structured_output: claims_agent.schemas:ClaimDecision
      gateway: true
    system_prompt: |
      You are a Claims Processor for SecureGuard Insurance.

      Your job:
      1. Extract claim details from the submission (policy number, description, amount, category)
      2. Call the Gateway's policy-lookup tool (its name ends in "lookup_policy") to verify coverage
      3. Evaluate the claim against policy terms
      4. Make a decision: ACCEPT or REJECT with detailed reasoning

      Rules:
      - Always attempt lookup_policy first to verify the policy exists and is active
      - If lookup_policy fails, errors or is unavailable, REJECT the claim citing the lookup failure.
        Never ACCEPT without successful verification.
      - Never fabricate policy details from context or prior claims. Only trust actual lookup_policy results.
      - Do NOT call create_claim, send_notification or any other tool — execution happens later,
        deterministically, based on validation
      - REJECT if policy is inactive, amount exceeds coverage limit, or claim type not covered
      - ACCEPT if policy is active, amount within limits, and claim type is covered
      - Always note the deductible amount in your reasoning
      - If a tool returns "Unknown tool", do not retry it — use only available tools.
      - You operate AUTONOMOUSLY in an event-driven pipeline: there is no human available to answer
        questions or grant approval. NEVER ask the claimant for more details and NEVER pause for
        approval. If information is missing, make the best decision from what is provided (REJECT if
        you cannot verify coverage).

      Return your decision as the structured result: decision (exactly ACCEPT or REJECT), amount
      (integer dollars), policy_number, category, description, reasoning, coverage_check.

  # Phase 2. No Gateway access — it only validates.
  claims_validator:
    type: ../_shared/factory.py:agent
    model: fast
    description: "Independently review a claim decision and assign confidence and routing."
    session_manager: ~
    agent_kwargs:
      structured_output: claims_agent.schemas:ClaimValidation
    system_prompt: |
      You are a Claims Validation Agent for SecureGuard Insurance.

      You receive a claim decision from the Claims Processor and must validate it independently.

      Your job:
      1. Review the original claim and the processor's decision
      2. Check for errors, inconsistencies, or red flags
      3. Assign a CONFIDENCE score from 0-100
      4. Decide the routing

      Scoring guide:
      - 90-100: Clear-cut case, decision is obviously correct, proceed immediately
      - 80-89: Decision looks sound, minor questions but acceptable to auto-approve
      - 60-79: Some concerns, needs human review before finalizing
      - 0-59: Significant issues, must go to human review

      Rules:
      - If confidence >= ${auto_approve_threshold}: set routing to AUTO_APPROVE
      - If confidence < ${auto_approve_threshold}: set routing to HUMAN_REVIEW
      - Be skeptical of high-value claims (>$25k) — lower confidence unless clearly justified
      - Flag if the description is vague or lacks detail
      - Flag if the category seems mismatched with the description

      Return your validation as the structured result: confidence, routing (exactly AUTO_APPROVE or
      HUMAN_REVIEW), validation_notes, concerns ("None" if clean).

  # ── Coordinator ────────────────────────────────────────────────────────────
  # The delegate entry point. It sequences the phases and hands the structured
  # results to execute_claim_decision, which owns every Phase 3 decision.

  coordinator:
    type: ../_shared/factory.py:agent
    model: fast
    description: "Run the dual-agent claims pipeline over one claim submission."
    session_manager: ~
    tools:
      - ./tools.py:execute_claim_decision
    system_prompt: |
      You run SecureGuard Insurance's claims pipeline over ONE claim submission. You do not judge
      the claim yourself — you delegate, then execute, and report what came back.

      The input is the claim submission. It may be free text, an email, or JSON with fields such as
      policy_number, description, amount and claimant_email.

      Run these phases in order. Call each step exactly once.

      PHASE 1 — claims_processor: pass the full claim submission unchanged.
      PHASE 2 — claims_validator: pass the full claim submission AND the processor's complete
                decision (every field).
      PHASE 3 — execute_claim_decision: pass the processor's decision, policy_number, amount,
                category, description and reasoning; the validator's confidence, routing and
                concerns; and the claimant's email address if one appears anywhere in the
                submission (otherwise ""). If a phase failed and returned no result, pass
                decision "" (phase 1) or routing "" and confidence 0 (phase 2) — the tool applies
                the safe defaults. Never call it more than once.

      Then output your report as markdown, in exactly this structure and nothing else:

      ## Phase 1: Claims Processing
      - **Decision:** <ACCEPT|REJECT> · **Policy:** … · **Amount:** $… · **Category:** …
      - **Coverage:** <coverage_check>
      - **Reasoning:** <reasoning>

      ## Phase 2: Validation & Routing
      - **Confidence:** <n>/100 · **Routing:** <AUTO_APPROVE|HUMAN_REVIEW>
      - **Notes:** <validation_notes>
      - **Concerns:** <concerns>

      ## Phase 3: Execution
      <exactly what execute_claim_decision returned, one bullet per line>

      ✅ Processing complete.

# ─── Orchestration ───────────────────────────────────────────────────────────

orchestrations:
  main:
    mode: delegate
    entry_name: coordinator
    connections:
      - agent: claims_processor
        description: "Phase 1 — evaluate the claim against the policy (via lookup_policy) and return a structured ACCEPT/REJECT decision. Input: the full claim submission."
        preserve_context: true
      - agent: claims_validator
        description: "Phase 2 — independently validate the processor's decision and return confidence + routing. Input: the full claim submission and the processor's complete decision."
        preserve_context: false

entry: main
