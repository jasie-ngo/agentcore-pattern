# claims_agent — the dual-agent insurance claims pipeline, defined in YAML
#
# Phase 1  claims_processor (Sonnet, assessor blueprint) -> lookup_policy -> ACCEPT/REJECT
# Phase 2  claims_validator (Haiku, reviewer blueprint)  -> checks + approved + CONFIDENCE
# Phase 3  execute_claim_decision -> decisions.yaml picks the action, then deterministic
#          create_claim / request_human_review / send_notification; no LLM picks the tools
#
# The coordinator drives the phases through a delegate orchestration. Generic
# wiring (agent factory, Gateway client, Memory session manager) is shared with
# every other use case in ../_shared/.
#
# Run (from the event-driven-claims-agent folder):
#   sca dev --config app/claims_agent/config.yaml
# Deployed: selected in app/main.py (see SWITCHING_USE_CASES.md).

version: "1"
log_level: ${LOG_LEVEL:-INFO}

vars:
  primary_model: ${AGENT_MODEL_ID:-global.anthropic.claude-sonnet-4-6}
  fast_model: ${FAST_MODEL_ID:-global.anthropic.claude-haiku-4-5-20251001-v1:0}
  # Same env var and default as decisions.yaml, interpolated into the validator
  # prompt so the model and the deterministic routing agree.
  auto_approve_threshold: ${AUTO_APPROVE_THRESHOLD:-80}

# ─── Models ───────────────────────────────────────────────────────────────────
# Cost-based routing: Sonnet for the reasoning-heavy claim decision, Haiku for
# validation (a classification task) and for the coordinator, which only
# sequences the phases and relays structured results.

models:
  primary:
    provider: bedrock
    model_id: ${primary_model}

  fast:
    provider: bedrock
    model_id: ${fast_model}

# ─── Session manager ─────────────────────────────────────────────────────────
# AgentCore Memory, declared globally (strands-compose only rewrites a root-level
# session_manager.type to an absolute path) and opted out of by every agent
# except claims_processor, which benefits from recalling prior claims.
# Falls back to local file sessions when no memory id is set.

session_manager:
  type: ../_shared/memory.py:session_manager
  params:
    actor_id: claims-processor
    memory_id: ${MEMORY_CLAIMSAGENTMEMORY_ID:-}
    top_k: ${MEMORY_RETRIEVAL_TOP_K:-5}
    relevance_score: ${MEMORY_RETRIEVAL_RELEVANCE:-0.5}
    namespace_prefix: claims

# ─── Agents ───────────────────────────────────────────────────────────────────
# Every agent uses the shared factory (../_shared/factory.py):
# The two specialists are agent blueprints (../_shared/agent_blueprints.py): the
# form under agent_kwargs becomes their system prompt and structured output.
# agent_kwargs.gateway: true attaches the Identity-managed Gateway MCP client.

agents:
  # Phase 1. Assessor blueprint: gathers evidence with the Gateway, picks an
  # outcome. The only agent with Gateway access (least privilege) and the only
  # one with AgentCore Memory — hence preserve_context: true on its connection.
  claims_processor:
    type: ../_shared/agent_blueprints.py:assessor
    model: primary
    description: "Evaluate an insurance claim against the policy and decide ACCEPT or REJECT."
    agent_kwargs:
      gateway: true
      context: "You are a Claims Processor for SecureGuard Insurance."
      task: >-
        Extract the claim details from the submission, verify coverage with the Gateway's
        policy-lookup tool (its name ends in "lookup_policy"), and decide ACCEPT or REJECT.
      outcomes:
        - { id: ACCEPT, when: "the policy is active, the amount is within the coverage limit and the claim type is covered" }
        - { id: REJECT, when: "the policy is inactive or not found, the amount exceeds coverage, the claim type is not covered, or coverage could not be verified" }
      criteria:
        - "Always call lookup_policy first; only trust what it returns, never policy details from context or prior claims."
        - "Note the deductible in the coverage check."
      fallback_outcome: REJECT
      facts:
        policy_number: { description: "Policy number being claimed against" }
        amount: { type: integer, description: "Claim amount in whole dollars" }
        category:
          enum: [auto_collision, property_damage, theft, natural_disaster, medical, general]
          description: "Claim category"
        description: { description: "Brief description of the claim" }
        coverage_check: { description: "Coverage verification summary: limits, active status, deductible" }
      extra_instructions: |
        - Do NOT call create_claim, send_notification or any other tool — execution happens later,
          deterministically. If a tool returns "Unknown tool", do not retry it.
        - You operate AUTONOMOUSLY in an event-driven pipeline: there is no human to answer questions.
          NEVER ask for more details and NEVER pause for approval; decide from what is provided.

  # Phase 2. Reviewer blueprint: an independent checklist. No Gateway access.
  claims_validator:
    type: ../_shared/agent_blueprints.py:reviewer
    model: fast
    description: "Independently review a claim decision and score confidence."
    session_manager: ~
    agent_kwargs:
      context: "You are a Claims Validation Agent for SecureGuard Insurance."
      task: "Independently validate the Claims Processor's decision on the original claim."
      checks:
        decision_supported: "the outcome follows from the policy lookup and the claim details, with no errors or inconsistencies"
        amount_justified: "the amount is plausible for the description; high-value claims (over $25k) are clearly justified"
        description_clear: "the claim description is specific enough to act on, not vague"
        category_matches: "the category fits the description"
      extra_instructions: |
        Confidence guide: 90-100 clear-cut and obviously correct; 80-89 sound with minor questions;
        60-79 some concerns; 0-59 significant issues. Only a claim you approve with confidence
        ${auto_approve_threshold} or more is auto-approved — anything else goes to a human.

  # ── Coordinator ────────────────────────────────────────────────────────────
  # The delegate entry point. It sequences the phases and hands the structured
  # results to execute_claim_decision, which owns every Phase 3 decision.

  coordinator:
    type: ../_shared/factory.py:agent
    model: fast
    description: "Run the dual-agent claims pipeline over one claim submission."
    session_manager: ~
    tools:
      - ./tools.py:execute_claim_decision
    system_prompt: |
      You run SecureGuard Insurance's claims pipeline over ONE claim submission. You do not judge
      the claim yourself — you delegate, then execute, and report what came back.

      The input is one of:
      - an ENVELOPE: JSON with "envelope_version" — a submission already normalised by the
        framework's Trigger Lambda (everything that arrives through S3). The claim submission is
        its subject plus latest_message; the claimant's email is from_email; the policy number
        found in it (if any) is id_for_lookup; where it came from is source.
      - anything else (direct invocations): free text, an email, or JSON with fields such as
        policy_number, description, amount and claimant_email. That is the claim submission;
        its source is "".

      Run these phases in order. Call each step exactly once.

      PHASE 1 — claims_processor: pass the full claim submission unchanged.
      PHASE 2 — claims_validator: pass the full claim submission AND the processor's complete
                result (every field).
      PHASE 3 — execute_claim_decision: pass decision (the processor's outcome), policy_number,
                amount, category, description and reasoning (its reasons joined into one
                paragraph); the validator's confidence, approved and concerns (its issues joined
                with "; ", or "None"); the claimant's email address (the envelope's from_email, or
                one that appears in the submission — otherwise ""); and the source. If a phase
                failed and returned no result, pass decision "" (phase 1) or approved false and
                confidence 0 (phase 2) — the tool applies the safe defaults. Never call it more
                than once.

      Then output your report as markdown, in exactly this structure and nothing else:

      ## Phase 1: Claims Processing
      - **Decision:** <ACCEPT|REJECT> · **Policy:** … · **Amount:** $… · **Category:** …
      - **Coverage:** <coverage_check>
      - **Reasoning:** <reasons, one per bullet>

      ## Phase 2: Validation
      - **Confidence:** <n>/100 · **Approved:** <true|false>
      - **Checks:** decision_supported=… · amount_justified=… · description_clear=… · category_matches=…
      - **Concerns:** <issues, or "None">

      ## Phase 3: Execution
      <exactly what execute_claim_decision returned, one bullet per line>

      ✅ Processing complete.

# ─── Orchestration ───────────────────────────────────────────────────────────

orchestrations:
  main:
    mode: delegate
    entry_name: coordinator
    connections:
      - agent: claims_processor
        description: "Phase 1 — evaluate the claim against the policy (via lookup_policy) and return a structured ACCEPT/REJECT outcome with the claim facts. Input: the full claim submission."
        preserve_context: true
      - agent: claims_validator
        description: "Phase 2 — independently check the processor's decision and return checks, approved and confidence. Input: the full claim submission and the processor's complete result."
        preserve_context: false

entry: main
