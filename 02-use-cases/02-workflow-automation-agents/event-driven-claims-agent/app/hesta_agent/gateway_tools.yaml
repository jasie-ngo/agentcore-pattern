# Gateway tools for the HESTA use case.
#
# HESTA currently owns no tools of its own: it reuses the claims tools, with the
# Policies table holding HESTA member records (scripts/seed_hesta_members.py).
# `uses:` lists them so the build checks they exist and the dependency is visible.
#
# To give HESTA its own tools (e.g. member_lookup on a Members table), add
# `tables:` and `tools:` sections here in the same format as
# app/claims_agent/gateway_tools.yaml, then rebuild:
#   uv run --project app python scripts/build_tools.py

uses:
  - lookup_policy          # identity_profiler — member record
  - list_pending_claims    # case_status_checker — existing cases
  - create_claim           # human_handoff — case record
  - request_human_review   # human_handoff — review record
