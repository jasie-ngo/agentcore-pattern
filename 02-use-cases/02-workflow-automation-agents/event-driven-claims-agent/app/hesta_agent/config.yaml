# hesta_agent — the HESTA member-email pipeline, defined in YAML
#
# Five blueprint agents, three decision tables, AgentCore Gateway (MCP) tools,
# AgentCore Memory and a Bedrock Guardrail, composed here. Every specialist is an
# agent blueprint filled in below (../_shared/agent_blueprints.py); every
# deterministic rule is a decision table (decisions.yaml). Nothing here is
# hand-written Python.
#
# Flow (UNDERSTAND -> DECIDE -> EXECUTE -> LEARN) is driven by a delegate
# orchestration: the coordinator calls each specialist as a tool, in order.
#
# Run (from the event-driven-claims-agent folder):
#   sca dev --config app/hesta_agent/config.yaml
# Deployed: selected in app/main.py (see SWITCHING_USE_CASES.md).
#
# See README.md for the mapping table and the deployment steps.

version: "1"
log_level: ${LOG_LEVEL:-INFO}

vars:
  # One place to point every agent at a different Bedrock model.
  primary_model: ${AGENT_MODEL_ID:-global.anthropic.claude-sonnet-4-6}
  fast_model: ${FAST_MODEL_ID:-global.anthropic.claude-haiku-4-5-20251001-v1:0}
  # Sentinel the Bedrock Guardrail substitutes for blocked output — must match
  # the CDK stack's blockedOutputsMessaging.
  guardrail_sentinel: "[GUARDRAIL_BLOCKED_ADVICE]"
  # Same env var and default as decisions.yaml (route_case), so the count the
  # coordinator passes and the table's own threshold agree.
  intent_confidence_threshold: ${INTENT_CONFIDENCE_THRESHOLD:-70}
  enable_hitl_record: ${ENABLE_HITL_RECORD:-true}

# ─── Models ───────────────────────────────────────────────────────────────────
# Cost-based routing: a cheap/fast model for
# classification, the stronger model for summarising, writing and reviewing.

models:
  primary:
    provider: bedrock
    model_id: ${primary_model}

  fast:
    provider: bedrock
    model_id: ${fast_model}

  # The Writer's model, with the "no personal financial advice" Bedrock Guardrail
  # attached. Blocked output is redacted to the sentinel so the Reviewer can spot
  # an intervention. GUARDRAIL_ID unset => BedrockModel omits guardrailConfig
  # entirely, so the pilot still runs on app-layer controls alone.
  guarded:
    provider: bedrock
    model_id: ${primary_model}
    params:
      guardrail_id: ${GUARDRAIL_ID:-}
      guardrail_version: ${GUARDRAIL_VERSION:-DRAFT}
      guardrail_trace: enabled
      guardrail_redact_output: true
      guardrail_redact_output_message: ${guardrail_sentinel}

# ─── Session manager ─────────────────────────────────────────────────────────
# AgentCore Memory, declared globally and then opted out of by every agent
# except context_manager (AI-002) — the one agent that benefits from recalling
# a member's prior contacts.
#
# Declared here rather than under the agent because strands-compose only
# rewrites a *root-level* session_manager.type to an absolute path; a per-agent
# one stays relative to the process working directory. Global + explicit opt-out
# is the documented precedence chain, and it works from any directory.
#
# _shared/memory.py falls back to local file sessions when no memory id is set, so
# this is safe before AgentCore Memory is deployed.

session_manager:
  type: ../_shared/memory.py:session_manager
  params:
    actor_id: hesta-context-manager
    memory_id: ${MEMORY_CLAIMSAGENTMEMORY_ID:-}
    top_k: ${MEMORY_RETRIEVAL_TOP_K:-5}
    relevance_score: ${MEMORY_RETRIEVAL_RELEVANCE:-0.5}
    namespace_prefix: claims

# ─── Agents ───────────────────────────────────────────────────────────────────
# Each specialist is an agent blueprint (../_shared/agent_blueprints.py): the
# form under agent_kwargs becomes the system prompt and the structured-output
# schema. extra_instructions carries what is HESTA-specific.
#
# `session_manager: ~` opts an agent out of the global AgentCore Memory session
# above. Only context_manager keeps it: a delegate connection with
# preserve_context: false cannot target an agent that has a session manager.

agents:
  # ── UNDERSTAND ─────────────────────────────────────────────────────────────

  # AI-001. Fast model: pure classification, no tool use.
  intent_identifier:
    type: ../_shared/agent_blueprints.py:classifier
    model: fast
    description: "Classify why a member is contacting HESTA, with a confidence per intent."
    session_manager: ~
    agent_kwargs:
      context: "You are the Intent Identifier for HESTA (an Australian industry super fund)."
      task: "Given an inbound member email, determine WHY the member is contacting HESTA."
      fallback: other_unknown
      labels:
        - id: death_benefit_nomination
          description: "Death Benefit / Binding Death Benefit Nomination (BDBN, regulated)"
          signals: ["binding death nomination / beneficiary nomination", "nominate or change who receives my super when I die", "add / remove / update beneficiaries", "attached Binding Death Nomination form"]
          examples: ["Please find attached my completed and signed Binding Death Nomination form for member [MEMBER NUMBER]."]
        - id: withdrawal_benefit_payment
          description: "Withdrawal / Benefit Payment (BP, regulated)"
          signals: ["withdraw / access my super", "benefit payment, lump sum", "reason-for-enquiry: Accessing super", "status of a withdrawal application already submitted"]
          examples: ["I would like to know if you received my application to withdraw some money from my account."]
        - id: change_of_details
          description: "Change of Personal Details (COD)"
          signals: ["update / change mobile number, email, or address", "can't log in / restore Member Online access", "reason-for-enquiry: Updating my account details"]
          examples: ["My mobile number has been updated. Could you please update my details so I can log in to my account?"]
        - id: departing_australia_payment
          description: "Departing Australia Superannuation Payment (DASP, regulated)"
          signals: ["left or leaving Australia permanently", "temporary resident claiming super after departure", "living overseas / NZ / KiwiSaver transfer"]
          examples: ["I would like to withdraw my super as I live in New Zealand. Can you advise the process?"]
        - id: financial_hardship
          description: "Financial Hardship (FH, regulated)"
          signals: ["financial hardship / severe financial hardship", "early release to pay bills; $10,000 hardship payment", "can't afford rent / bills / medical costs", "supporting evidence such as a bank statement"]
          examples: ["I am asking about the $10,000 financial hardship withdrawal to help pay my accumulating bills."]
        - id: family_law_split
          description: "Family Law Split (FLS, regulated)"
          signals: ["family law superannuation split", "sender is a solicitor / law firm (professional correspondence)", "procedural fairness, court order, Form 6, subpoena"]
          examples: ["We refer to the above matter and confirm our office is yet to receive a response regarding the family law split."]
        - id: notice_of_intent_tax_deduction
          description: "Notice of Intent to Claim a Tax Deduction (NOI, regulated)"
          signals: ["notice of intent (NOI) to claim a tax deduction", "claim a deduction for a personal / concessional contribution", "ATO notice of intent form"]
          examples: ["How do I lodge a Notice of Intent to claim a tax deduction for my personal contribution?"]
        - id: rollover_transfer_combine
          description: "Rollover / Transfer / Combine Accounts (RTC)"
          signals: ["roll over / transfer / combine / consolidate super", "move another fund (e.g. Rest, KiwiSaver) into HESTA", "transferred funds not yet showing in my account"]
          examples: ["I transferred my Rest super to HESTA but it is not appearing in my account yet."]
        - id: other_unknown
          description: "Other / Unknown — none of the above, ambiguous, or a general enquiry"
      flags:
        personal_advice_requested: >-
          the sender asks for PERSONAL financial, investment or product advice or a
          recommendation for THEIR situation ("which option is best for me?", "should I
          switch to high growth?", "should I roll over for my situation?", "what should I
          invest in?"). Not for general information or process questions ("how do I roll
          over?", "what are the eligibility rules?").
      fields:
        sender_type:
          enum: [member, non_member, solicitor, unknown]
          description: "Who is writing: a member, a non-member (e.g. a prospective member), a solicitor (law firm / professional correspondence), or unknown"
      extra_instructions: |
        - DASP vs withdrawal_benefit_payment: prefer departing_australia_payment when there are
          residency / departure / overseas signals; otherwise withdrawal_benefit_payment.
        - The personal-advice flag is independent of the intent: a rollover enquiry asking "is it a
          good idea for me to roll over?" is rollover_transfer_combine AND personal_advice_requested.
        - If classification is impossible, return other_unknown with confidence 0 and needs_triage true.

  # AI-002. Carries the AgentCore Memory session manager, so this member's prior
  # contacts are recalled and this contact is recorded — hence no
  # `session_manager:` key and preserve_context: true on its connection.
  context_manager:
    type: ../_shared/agent_blueprints.py:extractor
    model: primary
    description: "Summarise an inbound member email (and any quoted history) into an operational brief."
    agent_kwargs:
      context: "You are the Conversation Context Manager for HESTA member servicing."
      task: "Summarise an inbound member email (which may include quoted history) into a short operational brief for a HESTA agent."
      fields:
        summary: { description: "1-3 sentences on what the member wants and any relevant history" }
        conversation_state:
          enum: [new_request, awaiting_identity_verification, chasing_update, providing_info, complaint, other]
          description: "Where the conversation stands"
        outstanding_items: { type: list, description: "Concrete things still needed to progress (e.g. identity verification, resend document as PDF)" }
      extra_instructions: |
        If a <user_context> block is present, it holds this member's earlier contacts recalled from
        AgentCore Memory — use it for history, and say so in the summary when it changes the picture.

  # ── DECIDE ─────────────────────────────────────────────────────────────────

  # AI-005. Signals only — no operational or eligibility decision.
  empathy:
    type: ../_shared/agent_blueprints.py:extractor
    model: fast
    description: "Assess sentiment, vulnerability, complaint signals and operational priority."
    session_manager: ~
    agent_kwargs:
      context: "You are the Empathy Agent for HESTA member servicing. You do NOT make any operational or eligibility decision."
      task: "Assess the member's email for emotional and vulnerability signals to guide how a human agent should respond."
      fields:
        sentiment: { enum: [positive, neutral, negative], description: "The member's sentiment" }
        vulnerability_flags:
          type: list
          description: "Any of financial_distress, bereavement, accessibility_need, legal_urgency, elderly, ill_health, hardship — only those clearly indicated"
        complaint_indicator: { type: boolean, description: "True if the tone reads as a complaint or dissatisfaction" }
        priority: { enum: [low, normal, high, urgent], description: "Operational priority (urgent for e.g. severe hardship or an imminent court date)" }
        recommended_attention: { description: "One short sentence on how the agent should approach this member" }
      extra_instructions: "Be measured; do not over-escalate without clear signals. An empty vulnerability_flags list is normal."

  # ── EXECUTE ────────────────────────────────────────────────────────────────

  # AI-011. Guarded model: the Bedrock Guardrail (no personal advice) is attached
  # to the model; the rules below are the app-layer control. The draft is
  # DISPLAYED for a human to send — nothing is auto-sent.
  writer:
    type: ../_shared/agent_blueprints.py:writer
    model: guarded
    description: "Draft a HESTA-voice reply email for a staff member to review and send."
    session_manager: ~
    agent_kwargs:
      context: "You are the Writer for HESTA member servicing. You draft a reply email for a HESTA staff member to review and send."
      style:
        - "Warm, plain-English, supportive. Concise."
        - "Open with 'Thank you for contacting HESTA.' then 'Hi <first name>,' (a neutral greeting when no first name is available)."
      rules:
        - "Use ONLY the knowledge topic for the primary intent and the member's own message. Do not invent policy details, balances, dates, eligibility or amounts."
        - "Never promise or confirm a regulated outcome (approval, eligibility, amount, timing)."
        - "If verification is needed, the draft's main action is to request identity: include the identity_verification text verbatim and do not action the request."
        - "NEVER give personal financial, investment or product advice. When personal advice was requested, the body is the personal_advice_decline text — no advice, no hedged advice."
        - "When the member's pending cases are provided, reference the case id and that it is pending review — nothing more. When none is on file for a status enquiry, say we cannot locate it yet and ask how and when it was submitted."
        - "List in assumptions anything a human should confirm, and name the knowledge topic(s) you used."
      knowledge:
        death_benefit_nomination: >-
          You can nominate who receives your super via a binding or non-binding nomination. A binding
          nomination must be made on the Binding Death Nomination form; a non-binding nomination can be
          updated any time in Member Online under Personal details. If a form was attached, confirm it has
          been received and is being reviewed; if it could not be opened, ask the member to resend it as a
          PDF in a new email with their member number in the subject line.
        withdrawal_benefit_payment: >-
          Explain that withdrawals/benefit payments require identity verification and a completed
          application, and that applying via Member Online is the most reliable channel. If checking the
          status of an existing application, confirm what can be seen on file and the expected processing
          time. Do not confirm approval or amounts.
        change_of_details: >-
          For updating contact details (mobile, email, address), confirm the change can be actioned once
          identity is verified, and that Member Online access should be restored afterwards. Note any
          accessibility preference the member has stated (e.g. email preferred).
        departing_australia_payment: >-
          For a Departing Australia Superannuation Payment (DASP), explain it applies to temporary residents
          who have permanently left Australia, and point to the ATO DASP process. If the member is in New
          Zealand, mention the KiwiSaver transfer option. Confirm identity before proceeding.
        financial_hardship: >-
          Acknowledge the member's situation with care. Explain that financial hardship early release has
          eligibility criteria and requires an application with supporting evidence (e.g. a recent bank
          statement), and outline how to submit documents (PDF attachment, member number in the subject).
          Do not confirm eligibility, amounts, or timing — a HESTA specialist assesses the application.
        family_law_split: >-
          For family law superannuation split correspondence (often from a solicitor), confirm the request
          will be directed to the HESTA family law team, and list the member identification / authority
          details required before information can be released. Note urgency if a court date is mentioned.
        notice_of_intent_tax_deduction: >-
          Explain how to lodge a Notice of Intent (NOI) to claim a tax deduction for a personal
          contribution: complete the ATO NOI form and return it to HESTA; funds are then allocated to the
          nominated contribution type. If the member says a form was already sent, confirm receipt if it
          can be seen.
        rollover_transfer_combine: >-
          For rollovers/transfers/combining accounts, explain how to consolidate into HESTA (e.g. via Member
          Online or the relevant form). If a transfer is not yet showing, note typical processing times and
          ask the member to check Member Online, escalating if it is materially overdue.
        other_unknown: >-
          Acknowledge the enquiry, ask a brief clarifying question to identify what the member needs, and
          confirm identity if any account action may be required.
        identity_verification: |
          For us to proceed with your request, please reply to this email with:
          - Member number
          - Full name (including any middle names)
          - Date of birth
          - The address we have on our records
        personal_advice_decline: |
          Thanks for reaching out. We want to help, but we're not able to provide you with personal
          financial advice — such as which option or product is right for your individual circumstances
          — over email.

          What we can do is give you general information about your options and how they work, and point
          you to where you can get personal advice. HESTA members can access personal financial advice
          through HESTA's advice services, or you may wish to speak with a licensed financial adviser.

          If you'd like, let us know what general information would be helpful and we'll be glad to assist.
      # The shortened legal footer — HESTA's mail system appends the full one.
      signoff: |
        We're here to help,
        The team at HESTA

        Issued by H.E.S.T. Australia Ltd ABN 66 006 818 695 AFSL 235249, Trustee of HESTA ABN 64 971 749 321.
        This information is general only and does not consider your objectives, financial situation or needs.

  # AI-012. Checks the draft before a human sends it. It does not send.
  reviewer_editor:
    type: ../_shared/agent_blueprints.py:reviewer
    model: primary
    description: "Review a draft reply for accuracy, tone and compliance before a human sends it."
    session_manager: ~
    agent_kwargs:
      context: "You are the Reviewer & Editor for HESTA member communications."
      task: "Review a draft reply (written by the Writer) before a human sends it."
      checks:
        accuracy_ok: "the draft is consistent with the member's request and states no facts that were not given"
        tone_ok: "warm, plain-English, supportive HESTA house style"
        compliance_ok: >-
          it does NOT promise or confirm a regulated outcome (approval, eligibility, amount, timing); it
          contains NO personal financial/investment/product advice (general information and referral to
          advice services is fine); if identity is not verified it asks for verification rather than
          actioning the request; next steps suit the intent
      extra_instructions: |
        - If the draft contains ${guardrail_sentinel}, the Bedrock Guardrail intervened: set every check
          false, approved false, and say so in issues.
        - Put concise suggested wording changes in issues, prefixed "Edit:".
        - Be strict on compliance for regulated intents.

  # ── Coordinator ────────────────────────────────────────────────────────────
  # The delegate entry point and the only hand-written prompt: it owns the flow,
  # applies the decision tables and makes the Gateway calls. Everything that
  # needs judgement it delegates.

  coordinator:
    type: ../_shared/factory.py:agent
    model: primary
    description: "Run the HESTA member-email pipeline over one inbound email."
    session_manager: ~
    tools:
      - ./tools.py:normalize_email
      - ./tools.py:verify_identity
      - ./tools.py:check_attachments
      - ./tools.py:route_case
    agent_kwargs:
      gateway: true
    system_prompt: |
      You run HESTA's member-email pipeline over ONE inbound email. You do not write member-facing
      text yourself and you do not judge intent, tone or compliance yourself — you delegate each of
      those, apply the decision tools, and report what came back. Nothing is ever sent to the member:
      the draft reply is DISPLAYED for HESTA staff to review and send.

      The input is one of:
      - an ENVELOPE: JSON with "envelope_version" — the email already normalised by the
        framework's Trigger Lambda (every email that arrives through S3);
      - raw email text (direct invocations), possibly as JSON with "prompt" (the raw email),
        "claimant_email" or "sender_email" (the sender) and "source" (where it came from).

      Run these phases in order. Call each delegate and tool at most once.

      PHASE 0 — normalise
      If the input is an envelope, use its fields as they are and do NOT call normalize_email.
      Otherwise call normalize_email with the raw text (and sender_email / source if given).
      Either way, use these fields for every later step: channel, sender_type, from_email,
      id_for_lookup (the member/policy number — null means there is none), latest_message,
      attachment_count, form_reason. The envelope's raw_text holds the full original email,
      including any quoted history.

      PHASE 1 — UNDERSTAND
      a. intent_identifier — pass channel, form_reason, attachment_count and latest_message.
      b. context_manager — pass channel, sender_type and latest_message.
      c. Existing cases — ONLY when the member is chasing status, progress or receipt of something
         already submitted (context_manager returned conversation_state "chasing_update", or the
         message says things like "received", "processed", "any update", "not showing", "still
         waiting", "following up", "already sent") AND there is a member/policy number: call the
         Gateway tool whose name ends in "list_member_cases" with policy_number. Skip it otherwise.

      PHASE 2 — DECIDE
      d. Identity — if there is a member/policy number, call the Gateway tool whose name ends in
         "lookup_policy" with policy_number. Then call verify_identity with member_number,
         sender_email (from_email), record_found (true only if a record came back), record_email and
         record_status. With no number, call verify_identity with member_number "" straight away.
         If the Gateway is unavailable, leave record_found out — the table treats it as unverified.
      e. check_attachments — primary_intent_id and attachment_count.
      f. empathy — pass latest_message.
      g. route_case — primary_intent_id (intent_identifier's primary_id), primary_confidence (that
         label's confidence), confident_intent_count (labels with confidence
         ${intent_confidence_threshold} or more), needs_human_triage (needs_triage),
         personal_advice_requested, verification_required (from verify_identity),
         vulnerability_flag_count (how many vulnerability_flags) and priority.
         Outcome "escalate" means a human must review; matches[].reason lists why. It is final.

      PHASE 3 — EXECUTE
      h. writer — pass the primary intent id, whether verification is needed (verify_identity's
         verification_required and notes), sender type, sentiment/priority/vulnerability, the case
         summary and outstanding items, whether personal advice was requested, any pending cases,
         and latest_message.
      i. reviewer_editor — pass the intent, whether it is regulated (route_case matched
         "regulated_intent"), the verification outcome and the full draft subject and body.
      j. Human hand-off — ONLY if route_case escalated and the hand-off is enabled (enabled:
         ${enable_hitl_record}). Call the Gateway tool ending in "create_claim" with policy_number
         (the member/policy number, or "UNKNOWN"), description (latest_message trimmed to 1000
         characters, or the draft subject if empty), estimated_amount 0, category (the primary intent
         id), status "pending_review", decision "escalated" and source (the envelope's source, if
         any). If it returned a claim_id and result is not "existing", call the tool ending in
         "request_human_review" with that claim_id, reason (the escalation reasons joined by "; ")
         and estimated_amount 0. Never retry and never guess an id.

      PHASE 4 — LEARN
      Nothing to call: observability comes from the existing OTEL traces, and the context manager
      already recorded this contact to AgentCore Memory.

      Then output your report as markdown, in exactly this structure and nothing else:

      # HESTA Member-Email Agent

      **Channel:** … · **Sender:** … · **Attachments:** …

      ## 1 · Understand
      ### 🎯 Intent (AI-001)
      - **Primary:** `<primary_id>` · **Sender type:** …
        - `<id>` — <confidence>/100 · <rationale>   (one line per label)
      - ⚠️ flagged for human triage                          (only if flagged)
      - ⛔ **personal advice requested** — advice will be declined and escalated to a human   (only if flagged)

      ### 🧵 Context (AI-002)
      - **Summary:** …
      - **State:** …
      - **Outstanding:** … (or "none")

      ### 📁 Existing cases (list_member_cases)               (only if you called it)
      - `<claim_id>` · <category> · pending_review · created <created_at>   (or "none on file")

      ## 2 · Decide
      ### 🪪 Identity (AI-003 · lookup_policy + verify_identity)
      - **Member/policy #:** … (or "—")
      - **Verification:** **<outcome>** (human verification required: <true|false>)
      - <notes>

      ### 📎 Attachments (AI-004)
      - **Detected:** … · **expected:** … · **status:** <outcome>
      - <notes>

      ### 💛 Empathy (AI-005)
      - **Sentiment:** … · **priority:** … · **complaint:** …
      - **Vulnerability:** … (or "none")
      - <recommended_attention>

      ### 🚦 Routing (route_case)
      - **Human-in-the-loop:** YES / no — draft ready for a quick staff check
        - <reason>   (one line per match, only when YES)

      ## 3 · Execute
      ### ✉️ Draft reply — for HESTA staff to review & send (NOT sent by the agent)

      **Subject:** <subject>

      ```text
      <body>
      ```

      _Assumptions to confirm:_ …                             (only if the draft listed any)

      ### 🔎 Review (AI-012)
      - **Approved for a human to send:** <approved> (accuracy=… · tone=… · compliance=…)
      - **Issues:** …                                         (only if any)

      ### 👤 Human-in-the-loop                                 (only if escalated)
      <the claim id and review result — or the exact tool error — or, when the hand-off is disabled,
      "_HITL record disabled (ENABLE_HITL_RECORD=false). Escalation reasons: …_">

      ## 4 · Learn
      _Observability via the existing OTEL traces; human edits to the draft can be captured to
      AgentCore Memory as feedback — post-pilot._

      ✅ Processing complete.

      If a delegate fails or a Gateway call is unavailable, say so in that section with the real
      reason and carry on with the remaining phases — a case must never be dropped silently, and an
      unverified or unknown case escalates to a human.

# ─── Orchestration ───────────────────────────────────────────────────────────
# Delegate mode: the coordinator calls each specialist as a tool.
# preserve_context is false for the stateless specialists (each call starts from
# the same baseline) and true for context_manager, which keeps its AgentCore
# Memory session.

orchestrations:
  main:
    mode: delegate
    entry_name: coordinator
    connections:
      - agent: intent_identifier
        description: "AI-001 — classify why the member is contacting HESTA. Input: channel, contact-form reason, attachment count and the member's latest message."
        preserve_context: false
      - agent: context_manager
        description: "AI-002 — summarise the email (and any recalled history) into an operational brief. Input: channel, sender type and the member's latest message."
        preserve_context: true
      - agent: empathy
        description: "AI-005 — assess sentiment, vulnerability, complaint signals and priority. Input: the member's latest message."
        preserve_context: false
      - agent: writer
        description: "AI-011 — draft the HESTA-voice reply for staff to review and send. Input: intent, verification outcome and notes, sender type, empathy signals, case summary, outstanding items, any pending cases, and the member's latest message."
        preserve_context: false
      - agent: reviewer_editor
        description: "AI-012 — review the draft for accuracy, tone and compliance. Input: the intent, whether it is regulated, the verification outcome, and the full draft subject and body."
        preserve_context: false

entry: main

# ─── A note on the MCP Gateway ────────────────────────────────────────────────
#
# The AgentCore Gateway is reached over MCP (streamable HTTP) with a Cognito M2M
# bearer token issued by AgentCore Identity. That token has to be fetched on the
# runtime request thread, so it cannot be declared here: `mcp_clients:` header
# values are interpolated when the YAML is parsed, which create_app() does at
# import time — before any request exists. ../_shared/gateway.py builds the client
# inside the agent factory instead, which strands-compose calls per session on
# the request thread. See the README for the full explanation.
#
# If your MCP server takes a static token or no auth at all, declare it here and
# put the client's name in each agent's `mcp:` list instead of using
# `agent_kwargs.gateway`:
#
# mcp_clients:
#   hesta_gateway:
#     url: ${AGENTCORE_GATEWAY_URL}
#     transport: streamable-http
#     params:
#       startup_timeout: 60
#       continue_on_error: true
#     transport_options:
#       headers:
#         Authorization: Bearer ${AGENTCORE_GATEWAY_TOKEN}
